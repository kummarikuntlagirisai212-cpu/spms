<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPMS Panel - Account Setting</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f2f6;
      color: #333;
    }

    .wrapper {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #2f3542;
      color: #fff;
      min-height: 100vh;
    }

    .logo {
      padding: 18px 16px;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo i {
      margin-right: 8px;
    }

    .menu {
      padding-top: 10px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      color: #dfe4ea;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #3b4252;
      color: #fff;
    }

    .menu a.active {
      background: #0d6efd;
      color: #fff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 60px;
      background: #343a40;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 0 20px;
    }

    .welcome {
      font-size: 13px;
    }

    .logout-btn {
      background: #0d6efd;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
    }

    .content {
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      max-width: 100%;
    }

    .card-header {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }

    .card-body {
      padding: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      height: 38px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 2px rgba(13,110,253,0.08);
    }

    .submit-btn {
      width: 100%;
      height: 40px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    footer{
      width: 100%;
      height: 50px;
      background-color: #2f3542;
      text-align: center;
      color: #d9d9d9;
      padding-top: 20px;
    }

    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
      }

      .topbar {
        justify-content: space-between;
      }

      .content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar">
      <div class="logo"><i class="fa-solid fa-car-side"></i> SPMS Panel</div>

      <nav class="menu">
        <a href="dashbord.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="category.html"><i class="fa-solid fa-folder"></i> Category</a>
        <a href="vehicle entry.html"><i class="fa-solid fa-car"></i> Vehicle Entry</a>
        <a href="manage.html"><i class="fa-solid fa-list"></i> Manage Vehicles</a>
        <a href="report.html"><i class="fa-solid fa-chart-column"></i> Reports</a>
        <a href="s.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
        <a href="account.html" class="active"><i class="fa-solid fa-gear"></i> Account Setting</a>
        <a href="index.html"><i class="fa-solid fa-power-off"></i> Logout</a>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="welcome"><i class="fa-solid fa-circle-user"></i> Welcome, Administrator</div>
        <button class="logout-btn" href="index.html">Logout</button>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <i class="fa-solid fa-gear"></i> Change Your Password
          </div>

          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" placeholder="Current Password">
            </div>

            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" placeholder="New Password">
            </div>

            <div class="form-group">
              <label class="form-label">Re enter Password</label>
              <input type="password" class="form-control" placeholder="Re enter Password">
            </div>

            <button class="submit-btn">Change Password</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
  © 2026 SPMS | All Rights Reserved
</footer>
</body>
</html>
