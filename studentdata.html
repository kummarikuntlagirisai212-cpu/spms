<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD View Modal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 80px auto;
    }

    .title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .table-box {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    thead {
      background: #2f3742;
      color: white;
    }

    th,
    td {
      padding: 16px 14px;
      text-align: left;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    tbody tr {
      background: #f7f7f7;
    }

    .action-buttons {
      white-space: nowrap;
    }

    .btn {
      border: none;
      padding: 8px 16px;
      color: white;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      margin-right: 6px;
    }

    .edit-btn {
      background: #28a745;
    }

    .delete-btn {
      background: #dc3545;
    }

    @media (max-width: 768px) {
      .container {
        width: 96%;
        margin: 40px auto;
      }

      .title {
        font-size: 24px;
      }

      th,
      td {
        font-size: 13px;
        padding: 10px 8px;
      }

      .btn {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th style="width: 220px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>sai</td>
            <td>giri</td>
            <td>saigiri@gmail.com</td>
            <td class="action-buttons">
              <button class="btn edit-btn">Edit</button>
              <button class="btn delete-btn">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
